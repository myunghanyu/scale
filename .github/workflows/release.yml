name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - run: build/Scale.app/Contents/MacOS/Scale selftest
      - run: ditto -c -k --keepParent build/Scale.app build/Scale.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" build/Scale.zip --title "Scale $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
